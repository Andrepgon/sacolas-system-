<!-- @dsCard group="Components" viewport="700x440" name="Navigation — sidebar & tab bar" subtitle="Sidebar (desktop) · BottomTabBar (mobile)" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 22px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-hint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .stage { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .side-frame { height: 360px; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
  .phone { width: 300px; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface-page); }
  .phone__body { height: 300px; display: flex; align-items: center; justify-content: center; color: var(--text-hint); font-size: 13px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Sidebar, BottomTabBar } = window.SacolasCRMDesignSystem_553a9b
  function Demo() {
    const [a, setA] = React.useState('contacts')
    const [m, setM] = React.useState('overview')
    return (
      <div className="stage">
        <div>
          <div className="lbl">Sidebar · desktop</div>
          <div className="side-frame">
            <Sidebar active={a} onNavigate={setA} logoSrc="../../assets/logo-mark.png" />
          </div>
        </div>
        <div>
          <div className="lbl">BottomTabBar · mobile</div>
          <div className="phone">
            <div className="phone__body">Conteúdo</div>
            <BottomTabBar active={m} onNavigate={(k)=> k!=='new' && setM(k)} />
          </div>
        </div>
      </div>
    )
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />)
</script>
</body>
</html>

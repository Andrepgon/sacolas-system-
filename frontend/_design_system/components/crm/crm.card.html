<!-- @dsCard group="Components" viewport="700x520" name="CRM patterns" subtitle="KpiCard · StatusBadge · ContactRow · AttentionItem" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 22px; }
  .group { margin-bottom: 22px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-hint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 520px; }
  .panel { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 4px 14px; max-width: 460px; }
  .list { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; max-width: 520px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { KpiCard, StatusBadge, ContactRow, AttentionItem } = window.SacolasCRMDesignSystem_553a9b
  function Demo() {
    return (
      <>
        <div className="group">
          <div className="lbl">KpiCard</div>
          <div className="kpis">
            <KpiCard label="Receita do mês" value="R$ 12.480" delta="18%" deltaDir="up" sub="Ticket médio R$ 312" />
            <KpiCard label="Leads abertos" value="7" sub="2 sem resposta" alertSub />
          </div>
        </div>
        <div className="group">
          <div className="lbl">StatusBadge</div>
          <div className="pills">
            <StatusBadge status="customer" />
            <StatusBadge status="lead" />
            <StatusBadge status="vector_pending" />
            <StatusBadge status="printing" />
            <StatusBadge status="paid" />
            <StatusBadge status="cancelled" />
          </div>
        </div>
        <div className="group">
          <div className="lbl">ContactRow</div>
          <div className="list">
            <ContactRow name="Maria Souza" business="Papelaria Aurora" status="customer" ltv="R$ 2.480" lastOrder="há 12 dias" />
            <ContactRow name="Bistro do Tó" phone="(11) 98765-4321" status="lead" />
            <ContactRow name="Confeitaria Bem-Doce" business="Confeitaria" status="inactive" ltv="R$ 640" lastOrder="há 4 meses" />
          </div>
        </div>
        <div className="group">
          <div className="lbl">AttentionItem · Precisa de atenção hoje</div>
          <div className="panel">
            <AttentionItem tone="amber" label="Clientes pra reativar" count={5} />
            <AttentionItem tone="danger" label="Em risco — sem comprar há +60 dias" count={3} />
            <AttentionItem tone="info" label="Leads sem resposta há +3 dias" count={2} />
          </div>
        </div>
      </>
    )
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />)
</script>
</body>
</html>

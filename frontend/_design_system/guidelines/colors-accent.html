<!-- @dsCard group="Colors" viewport="700x150" name="Accent — kraft amber" subtitle="The single brand accent. Primary button + active nav only." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 13px; font-weight: var(--weight-medium); color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .use { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background: var(--amber-600)"></div>
      <div class="meta"><div class="name">Primary</div><div class="hex">#BA7517 · amber-600</div><div class="use">primary button, active nav</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--amber-700)"></div>
      <div class="meta"><div class="name">Primary hover</div><div class="hex">#9A6010 · amber-700</div><div class="use">hover / pressed</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--amber-tint, #fbf3e6)"></div>
      <div class="meta"><div class="name">Accent tint</div><div class="hex">#FBF3E6 · amber-50</div><div class="use">soft accent fills</div></div>
    </div>
  </div>
</body>
</html>

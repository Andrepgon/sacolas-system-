<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — status meaning" subtitle="Color encodes meaning, not decoration. Deltas, risk, info." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); overflow: hidden; }
  .chip { height: 56px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 13px; font-weight: var(--weight-medium); color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .use { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--positive)"></div><div class="meta"><div class="name">Positivo</div><div class="hex">#059669</div><div class="use">deltas ▲, cliente</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="meta"><div class="name">Atenção</div><div class="hex">#BA7517</div><div class="use">em risco baixo</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--negative)"></div><div class="meta"><div class="name">Negativo</div><div class="hex">#DC2626</div><div class="use">risco alto, ▼</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--info-color)"></div><div class="meta"><div class="name">Informação</div><div class="hex">#1D6FC7</div><div class="use">leads</div></div></div>
  </div>
</body>
</html>

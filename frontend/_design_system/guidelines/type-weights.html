<!-- @dsCard group="Type" viewport="700x150" name="Weights — 400 & 500 only" subtitle="Regular and medium. 700 is forbidden — too heavy for the register." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; display: flex; gap: 36px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; gap: 4px; }
  .w { font-size: 28px; color: var(--text-primary); line-height: 1.1; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-hint); }
  .no { position: relative; opacity: 0.4; }
  .no .w { color: var(--text-secondary); }
  .strike { position: absolute; top: 50%; left: -4px; right: -4px; height: 1.5px; background: var(--negative); }
</style>
</head>
<body>
  <div class="col"><span class="w" style="font-weight:400">Receita</span><span class="tag">400 · regular</span></div>
  <div class="col"><span class="w" style="font-weight:500">Receita</span><span class="tag">500 · medium</span></div>
  <div class="col no"><span class="w" style="font-weight:700">Receita</span><span class="strike"></span><span class="tag" style="color:var(--negative)">700 · proibido</span></div>
</body>
</html>

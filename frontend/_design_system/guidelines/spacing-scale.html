<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base. Card padding 16 (mobile) / 24 (desktop)." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; display: flex; gap: 14px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { background: var(--accent-tint); border: 1px solid var(--amber-100); border-radius: 3px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-hint); }
</style>
</head>
<body>
  <div class="col"><div class="box" style="width:4px;height:4px"></div><span class="tag">1·4</span></div>
  <div class="col"><div class="box" style="width:8px;height:8px"></div><span class="tag">2·8</span></div>
  <div class="col"><div class="box" style="width:12px;height:12px"></div><span class="tag">3·12</span></div>
  <div class="col"><div class="box" style="width:16px;height:16px"></div><span class="tag">4·16</span></div>
  <div class="col"><div class="box" style="width:24px;height:24px"></div><span class="tag">6·24</span></div>
  <div class="col"><div class="box" style="width:32px;height:32px"></div><span class="tag">8·32</span></div>
  <div class="col"><div class="box" style="width:40px;height:40px"></div><span class="tag">10·40</span></div>
  <div class="col"><div class="box" style="width:48px;height:48px"></div><span class="tag">12·48</span></div>
</body>
</html>

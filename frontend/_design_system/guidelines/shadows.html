<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Restrained. Cards lean on the hairline border, not shadow." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 28px 22px; display: flex; gap: 22px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 96px; height: 60px; background: var(--surface-card); border-radius: var(--radius-lg); }
  .bd { border: 1px solid var(--border-subtle); }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-hint); }
</style>
</head>
<body>
  <div class="col"><div class="box bd"></div><span class="tag">border · card</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="tag">sm</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="tag">md · popover</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="tag">lg · dialog</span></div>
  <div class="col"><div class="box bd" style="box-shadow:var(--shadow-focus)"></div><span class="tag">focus ring</span></div>
</body>
</html>

<!-- @dsCard group="Brand" viewport="700x180" name="App mark" subtitle="Square kraft-amber mark with the 'S' initial. Used as PWA icon." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; display: flex; align-items: center; gap: 28px; }
  .marks { display: flex; align-items: center; gap: 18px; }
  .marks img { display: block; border-radius: 22%; }
  .lockup { display: flex; align-items: center; gap: 12px; padding-left: 8px; border-left: 1px solid var(--border-subtle); }
  .lockup img { width: 40px; height: 40px; border-radius: 22%; }
  .wm { font-size: 20px; font-weight: var(--weight-medium); letter-spacing: var(--tracking-tight); color: var(--text-primary); }
  .sub { font-size: 12px; color: var(--text-hint); }
</style>
</head>
<body>
  <div class="marks">
    <img src="../assets/logo-mark.png" alt="Sacolas mark" style="width:96px;height:96px">
    <img src="../assets/logo-mark.png" alt="" style="width:48px;height:48px">
    <img src="../assets/logo-mark.png" alt="" style="width:28px;height:28px">
  </div>
  <div class="lockup">
    <img src="../assets/logo-mark.png" alt="">
    <div>
      <div class="wm">Sacolas</div>
      <div class="sub">CRM de clientes e pedidos</div>
    </div>
  </div>
</body>
</html>

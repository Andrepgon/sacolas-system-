<!-- @dsCard group="Type" viewport="700x150" name="Families — Geist & Geist Mono" subtitle="Geist for UI, Geist Mono for tabular numerals." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; display: flex; gap: 32px; }
  .col { flex: 1; }
  .label { font-size: 11px; color: var(--text-hint); font-family: var(--font-mono); margin-bottom: 8px; }
  .big { font-size: 30px; font-weight: var(--weight-medium); letter-spacing: var(--tracking-tight); color: var(--text-primary); line-height: 1.1; }
  .set { font-size: 14px; color: var(--text-secondary); margin-top: 6px; }
</style>
</head>
<body>
  <div class="col">
    <div class="label">var(--font-sans) · Geist</div>
    <div class="big" style="font-family:var(--font-sans)">Aa Bb Cc</div>
    <div class="set" style="font-family:var(--font-sans)">Receita do mês · clientes</div>
  </div>
  <div class="col">
    <div class="label">var(--font-mono) · Geist Mono</div>
    <div class="big mono">R$ 1.240</div>
    <div class="set mono">0123456789 · LTV</div>
  </div>
</body>
</html>

<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — slate ramp" subtitle="The whole UI is built on these. Page, cards, text, borders." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 6px; }
  .col { flex: 1; text-align: center; }
  .chip { height: 56px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
  .name { font-size: 10px; color: var(--text-secondary); margin-top: 6px; }
  .hex { font-family: var(--font-mono); font-size: 9px; color: var(--text-hint); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="chip" style="background:var(--slate-50)"></div><div class="name">50</div><div class="hex">page</div></div>
    <div class="col"><div class="chip" style="background:var(--slate-100)"></div><div class="name">100</div><div class="hex">muted</div></div>
    <div class="col"><div class="chip" style="background:var(--slate-200)"></div><div class="name">200</div><div class="hex">border</div></div>
    <div class="col"><div class="chip" style="background:var(--slate-300)"></div><div class="name">300</div><div class="hex">&nbsp;</div></div>
    <div class="col"><div class="chip" style="background:var(--slate-400)"></div><div class="name">400</div><div class="hex">hint</div></div>
    <div class="col"><div class="chip" style="background:var(--slate-500)"></div><div class="name">500</div><div class="hex">2ndary</div></div>
    <div class="col"><div class="chip" style="background:var(--slate-600)"></div><div class="name">600</div><div class="hex">&nbsp;</div></div>
    <div class="col"><div class="chip" style="background:var(--slate-700)"></div><div class="name">700</div><div class="hex">&nbsp;</div></div>
    <div class="col"><div class="chip" style="background:var(--slate-900)"></div><div class="name">900</div><div class="hex">text</div></div>
  </div>
</body>
</html>
